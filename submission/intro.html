<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spec Check — Giới thiệu</title>
<style>
:root {
  --page: #ffffff; --soft: #f6f7f9; --card: #ffffff; --line: #e5e7eb;
  --text: #0f172a; --muted: #5b6474; --faint: #94a3b8;
  --accent: #2563eb; --accent-weak: #eaf1ff; --accent-text: #1d4ed8;
  --ok: #16a34a; --ok-weak: #e8f7ee; --bad: #dc2626; --bad-weak: #fdecec; --warn: #d97706;
  --ai: #7c3aed; --ai-weak: #f3edff;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(15,23,42,.08);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0f1115; --soft: #161920; --card: #1a1d24; --line: #2a2e36;
    --text: #f3f4f6; --muted: #a1a7b3; --faint: #6b7280;
    --accent: #4f8cff; --accent-weak: #1b2a47; --accent-text: #8fb4ff;
    --ok: #34c467; --ok-weak: #15291d; --bad: #f2645f; --bad-weak: #301819; --warn: #f0a432;
    --ai: #a78bfa; --ai-weak: #251d3a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 16px/1.65 var(--font); color: var(--text); background: var(--page); -webkit-font-smoothing: antialiased; }
a { color: var(--accent-text); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

/* nav */
.nav { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 14px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; display: grid; place-items: center; font-size: 15px; }
.spacer { flex: 1; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.lang button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--text); color: var(--page); }
.nav-cta { font-size: 14px; font-weight: 600; text-decoration: none; background: var(--accent); color: #fff; padding: 7px 14px; border-radius: 999px; white-space: nowrap; }

/* hero */
.hero { padding: 72px 0 56px; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 48px; align-items: center; }
.eyebrow { color: var(--accent-text); font-weight: 700; font-size: 14px; letter-spacing: .02em; }
h1 { font-size: clamp(32px, 5vw, 48px); line-height: 1.15; margin: 10px 0 16px; letter-spacing: -.02em; }
.hero p.sub { font-size: 18px; color: var(--muted); margin: 0 0 24px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
.chip { font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; color: var(--muted); background: var(--soft); }
.ctas { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 600; font-size: 15px; padding: 11px 20px; border-radius: 999px; border: 1px solid var(--line); color: var(--text); background: var(--card); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

/* hero visual: a finding card */
.demo-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; font-size: 13.5px; }
.demo-card .head { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.dot { width: 20px; height: 20px; border-radius: 50%; color: #fff; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; flex: none; }
.dot.fail { background: var(--bad); } .dot.ok { background: var(--ok); } .dot.sm { width: 15px; height: 15px; font-size: 9px; }
.demo-card .name { font-weight: 700; }
.demo-card .meta { color: var(--muted); font-size: 12px; }
.rows { display: grid; grid-template-columns: 15px auto 1fr auto; gap: 5px 12px; align-items: center; margin: 4px 0 12px 30px; }
.rows .r { font-weight: 600; } .rows .e { color: var(--muted); } .rows .a { color: var(--bad); font-weight: 600; text-align: right; }
.fixline { margin-left: 30px; color: var(--muted); font-size: 12.5px; }
.fixline ul { margin: 2px 0 10px; padding-left: 18px; }
.fixed { margin-left: 30px; background: var(--ok-weak); border-radius: 10px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; font-size: 12.5px; }

/* sections */
section { padding: 64px 0; }
section.soft { background: var(--soft); }
h2 { font-size: clamp(26px, 3.4vw, 34px); line-height: 1.2; margin: 6px 0 12px; letter-spacing: -.015em; }
.lede { color: var(--muted); font-size: 17px; max-width: 720px; margin: 0 0 32px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.card h3 { font-size: 17px; margin: 8px 0 6px; }
.card p { margin: 0; color: var(--muted); font-size: 15px; }
.ico { font-size: 22px; }

.compare .card h3 { display: flex; align-items: center; gap: 8px; margin-top: 0; }
.steps { list-style: none; margin: 10px 0 0; padding: 0; counter-reset: s; }
.steps li { counter-increment: s; position: relative; padding: 9px 0 9px 38px; border-top: 1px solid var(--line); font-size: 15px; }
.steps li:first-child { border-top: 0; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 9px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--soft); color: var(--muted); }
.before li::before { background: var(--bad-weak); color: var(--bad); }
.after li::before { background: var(--accent-weak); color: var(--accent-text); }
.time { display: inline-block; margin-top: 12px; font-weight: 700; font-size: 14px; padding: 3px 10px; border-radius: 999px; }
.before .time { background: var(--bad-weak); color: var(--bad); } .after .time { background: var(--ok-weak); color: var(--ok); }

.flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.flow .card { padding: 16px; }
.flow .n { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-weak); color: var(--accent-text); font-weight: 800; display: grid; place-items: center; font-size: 14px; }
.flow h3 { font-size: 15.5px; }
.flow p { font-size: 14px; }

.theme { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.theme .card.main { border: 2px solid var(--accent); }
.tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--accent-text); background: var(--accent-weak); padding: 2px 10px; border-radius: 999px; }
.tag.ai { color: var(--ai); background: var(--ai-weak); }
.checklist { list-style: none; padding: 0; margin: 10px 0 0; }
.checklist li { padding: 4px 0 4px 26px; position: relative; color: var(--muted); font-size: 15px; }
.checklist li::before { content: "✓"; position: absolute; left: 2px; color: var(--ok); font-weight: 800; }

.rules { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.rules span { font-size: 13.5px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; }

/* calculator */
.calc { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
.calc .inputs { display: grid; gap: 16px; }
.calc label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
.calc label span.val { font-weight: 700; color: var(--accent-text); }
.calc input[type=range] { width: 100%; accent-color: var(--accent); }
.result { display: grid; gap: 10px; align-content: center; text-align: center; background: var(--accent-weak); border-radius: 16px; padding: 24px; }
.big { font-size: 44px; font-weight: 800; line-height: 1.1; color: var(--accent-text); letter-spacing: -.02em; }
.result small { color: var(--muted); font-size: 13px; }
.assume { font-size: 13px; color: var(--faint); margin-top: 14px; }

.limits li { margin: 6px 0; color: var(--muted); }
.limits b { color: var(--text); }

.code { font-family: var(--mono); font-size: 13.5px; background: #0f172a; color: #e2e8f0; border-radius: 12px; padding: 14px 16px; overflow-x: auto; white-space: pre; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.stat b { display: block; font-size: 24px; letter-spacing: -.01em; }
.stat span { color: var(--muted); font-size: 13px; }

footer { padding: 32px 0 48px; color: var(--faint); font-size: 13px; border-top: 1px solid var(--line); }

@media (max-width: 880px) {
  .hero .wrap, .theme, .calc, .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .flow, .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { padding: 40px 0 32px; }
  section { padding: 44px 0; }
}
@media (max-width: 520px) {
  .wrap { padding: 0 16px; }
  .flow { grid-template-columns: minmax(0, 1fr); }
  .nav-cta { display: none; }
  .rows { grid-template-columns: 15px 1fr auto; margin-left: 0; }
  .rows .e { display: none; }
  .fixline, .fixed { margin-left: 0; }
}
</style>
</head>
<body>

<nav class="nav"><div class="wrap">
  <div class="brand"><span class="mark" aria-hidden="true">✓</span><span>Spec Check</span></div>
  <span class="spacer"></span>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="vi">VI</button>
    <button type="button" data-lang="ko">한국어</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <a class="nav-cta" href="mockup.html" data-i18n="ctaTry"></a>
</div></nav>

<header class="hero"><div class="wrap">
  <div>
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1 data-i18n="h1"></h1>
    <p class="sub" data-i18n="sub"></p>
    <div class="chips"><span class="chip" data-i18n="chip1"></span><span class="chip" data-i18n="chip2"></span><span class="chip" data-i18n="chip3"></span><span class="chip" data-i18n="chip4"></span></div>
    <div class="ctas"><a class="btn primary" href="mockup.html" data-i18n="ctaTry"></a><a class="btn" href="#how" data-i18n="ctaHow"></a></div>
  </div>
  <div class="demo-card" aria-hidden="true">
    <div class="head"><span class="dot fail">✕</span><div><div class="name">launch_trailer_16x9.mp4</div><div class="meta" data-i18n="demoMeta"></div></div></div>
    <div class="rows">
      <span class="dot fail sm">✕</span><span class="r" data-i18n="rSize"></span><span class="e">≤ 30 MB</span><span class="a">42.6 MB</span>
      <span class="dot fail sm">✕</span><span class="r" data-i18n="rDim"></span><span class="e">1080 × 1920</span><span class="a">1920 × 1080</span>
      <span class="dot fail sm">✕</span><span class="r" data-i18n="rRatio"></span><span class="e">9:16</span><span class="a">16:9</span>
    </div>
    <div class="fixline"><b data-i18n="fixWill"></b><ul><li data-i18n="fix1"></li><li data-i18n="fix2"></li></ul></div>
    <div class="fixed"><span class="dot ok sm">✓</span><span data-i18n="fixedOk"></span></div>
  </div>
</div></header>

<section class="soft" id="problem"><div class="wrap">
  <div class="tag" data-i18n="pTag"></div>
  <h2 data-i18n="pTitle"></h2>
  <p class="lede" data-i18n="pLede"></p>
  <div class="grid3">
    <div class="card"><div class="ico">🔍</div><h3 data-i18n="p1t"></h3><p data-i18n="p1"></p></div>
    <div class="card"><div class="ico">🎛️</div><h3 data-i18n="p2t"></h3><p data-i18n="p2"></p></div>
    <div class="card"><div class="ico">🔁</div><h3 data-i18n="p3t"></h3><p data-i18n="p3"></p></div>
  </div>
</div></section>

<section id="compare"><div class="wrap">
  <div class="tag" data-i18n="cTag"></div>
  <h2 data-i18n="cTitle"></h2>
  <p class="lede" data-i18n="cLede"></p>
  <div class="grid2 compare">
    <div class="card before"><h3>✕ <span data-i18n="beforeT"></span></h3><ol class="steps"><li data-i18n="b1"></li><li data-i18n="b2"></li><li data-i18n="b3"></li><li data-i18n="b4"></li><li data-i18n="b5"></li></ol><span class="time" data-i18n="bTime"></span></div>
    <div class="card after"><h3>✓ <span data-i18n="afterT"></span></h3><ol class="steps"><li data-i18n="a1"></li><li data-i18n="a2"></li><li data-i18n="a3"></li><li data-i18n="a4"></li></ol><span class="time" data-i18n="aTime"></span></div>
  </div>
</div></section>

<section class="soft" id="how"><div class="wrap">
  <div class="tag" data-i18n="hTag"></div>
  <h2 data-i18n="hTitle"></h2>
  <p class="lede" data-i18n="hLede"></p>
  <div class="flow">
    <div class="card"><div class="n">1</div><h3 data-i18n="s1t"></h3><p data-i18n="s1"></p></div>
    <div class="card"><div class="n">2</div><h3 data-i18n="s2t"></h3><p data-i18n="s2"></p></div>
    <div class="card"><div class="n">3</div><h3 data-i18n="s3t"></h3><p data-i18n="s3"></p></div>
    <div class="card"><div class="n">4</div><h3 data-i18n="s4t"></h3><p data-i18n="s4"></p></div>
    <div class="card"><div class="n">5</div><h3 data-i18n="s5t"></h3><p data-i18n="s5"></p></div>
  </div>
  <p class="assume" data-i18n="rulesTitle" style="margin-top:28px;font-weight:600;color:var(--muted)"></p>
  <div class="rules" id="rules"></div>
</div></section>

<section id="theme"><div class="wrap">
  <div class="tag" data-i18n="tTag"></div>
  <h2 data-i18n="tTitle"></h2>
  <p class="lede" data-i18n="tLede"></p>
  <div class="theme">
    <div class="card main"><span class="tag" data-i18n="t1tag"></span><h3 data-i18n="t1t"></h3><p data-i18n="t1"></p><ul class="checklist"><li data-i18n="t1a"></li><li data-i18n="t1b"></li><li data-i18n="t1c"></li></ul></div>
    <div class="card"><span class="tag ai" data-i18n="t2tag"></span><h3 data-i18n="t2t"></h3><p data-i18n="t2"></p><ul class="checklist"><li data-i18n="t2a"></li><li data-i18n="t2b"></li><li data-i18n="t2c"></li></ul></div>
  </div>
</div></section>

<section class="soft" id="impact"><div class="wrap">
  <div class="tag" data-i18n="iTag"></div>
  <h2 data-i18n="iTitle"></h2>
  <p class="lede" data-i18n="iLede"></p>
  <div class="calc card">
    <div class="inputs">
      <label><span><span data-i18n="in1"></span>: <span class="val" id="v-files"></span></span><input type="range" id="files" min="5" max="300" step="5" value="40"></label>
      <label><span><span data-i18n="in2"></span>: <span class="val" id="v-manual"></span></span><input type="range" id="manual" min="1" max="15" step="1" value="4"></label>
      <label><span><span data-i18n="in3"></span>: <span class="val" id="v-reject"></span></span><input type="range" id="reject" min="0" max="50" step="5" value="15"></label>
    </div>
    <div class="result"><small data-i18n="outLabel"></small><div class="big" id="hours"></div><small id="out-detail"></small></div>
  </div>
  <p class="assume" data-i18n="assume"></p>
</div></section>

<section id="limits"><div class="wrap">
  <div class="grid2" style="gap:48px">
    <div>
      <div class="tag" data-i18n="lTag"></div>
      <h2 data-i18n="lTitle"></h2>
      <ul class="limits"><li data-i18n-html="l1"></li><li data-i18n-html="l2"></li><li data-i18n-html="l3"></li><li data-i18n-html="l4"></li></ul>
    </div>
    <div>
      <div class="tag" data-i18n="bTag"></div>
      <h2 data-i18n="bTitle"></h2>
      <p style="color:var(--muted);margin-top:0" data-i18n="bLede"></p>
      <div class="code">curl -fsSL https://raw.githubusercontent.com/thnhtng/FileConverter-mac/main/install.sh | bash</div>
      <div class="stats">
        <div class="stat"><b>93</b><span data-i18n="st1"></span></div>
        <div class="stat"><b>10</b><span data-i18n="st2"></span></div>
        <div class="stat"><b>5</b><span data-i18n="st3"></span></div>
        <div class="stat"><b>0</b><span data-i18n="st4"></span></div>
      </div>
    </div>
  </div>
</div></section>

<footer><div class="wrap" data-i18n="footer"></div></footer>

<script>
"use strict";
const STR = {

    l4: "<b>Status:</b> the check/fix engine passes 93 automated tests, including real ffmpeg conversions; the macOS screens are being finished and still need a first run on a Mac.",
    bTag: "Install & tech", bTitle: "One command to install", bLede: "Installs Homebrew (if needed), ffmpeg, ImageMagick and the app. Then right-click any file in Finder → Quick Actions.",
    st1: "automated tests", st2: "rules checked", st3: "example specs included", st4: "files uploaded anywhere",
    footer: "Spec Check — a new feature of File Converter for macOS (GPL-3.0 open source). Built with Claude Code for the AX Hero program.",
  }
};

let lang = (() => {
  try { const s = localStorage.getItem("speccheck-lang"); if (s && STR[s]) return s; } catch (e) {}
  const n = (navigator.language || "vi").slice(0, 2); return STR[n] ? n : "vi";
})();
const t = (k) => STR[lang][k] ?? STR.en[k] ?? k;
const fmt = (n, d = 0) => new Intl.NumberFormat(lang, { maximumFractionDigits: d }).format(n);

function render() {
  document.documentElement.lang = lang;
  document.title = "Spec Check — " + (lang === "vi" ? "Giới thiệu" : lang === "ko" ? "서비스 소개" : "Introduction");
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("rules").innerHTML = t("rules").map((r) => "<span>" + r + "</span>").join("");
  calc();
}

function calc() {
  const files = +document.getElementById("files").value;
  const manual = +document.getElementById("manual").value;
  const reject = +document.getElementById("reject").value;
  document.getElementById("v-files").textContent = fmt(files);
  document.getElementById("v-manual").textContent = fmt(manual);
  document.getElementById("v-reject").textContent = fmt(reject) + "%";
  const perMonth = files * 4.3;
  const savedCheck = perMonth * (manual - 10 / 60);           // minutes
  const rejectsAvoided = perMonth * reject / 100;              // loops
  const savedMin = Math.max(0, savedCheck + rejectsAvoided * 15);
  const hours = savedMin / 60;
  document.getElementById("hours").textContent = fmt(hours, hours < 10 ? 1 : 0) + (lang === "ko" ? "시간" : lang === "vi" ? " giờ" : " h");
  document.getElementById("out-detail").textContent = t("outDetail").replace("{d}", fmt(hours / 8, 1)).replace("{r}", fmt(Math.round(rejectsAvoided)));
}

document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("speccheck-lang", lang); } catch (e) {} render();
}));
["files", "manual", "reject"].forEach((id) => document.getElementById(id).addEventListener("input", calc));
render();
</script>
</body>
