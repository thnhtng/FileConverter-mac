<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spec Check — Mockup</title>
<style>
:root {
  --page: #f3f5f8; --window: #ffffff; --panel: #f7f8fa; --line: #e5e7eb; --line-strong: #d1d5db;
  --text: #111827; --muted: #6b7280; --faint: #9ca3af;
  --accent: #2563eb; --accent-weak: #eaf1ff; --accent-text: #1d4ed8;
  --ok: #16a34a; --ok-weak: #e8f7ee; --warn: #d97706; --warn-weak: #fdf3e2; --bad: #dc2626; --bad-weak: #fdecec;
  --ai: #7c3aed; --ai-weak: #f3edff;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 40px rgba(15,23,42,.10);
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0f1115; --window: #17191e; --panel: #1d2026; --line: #2a2e36; --line-strong: #3a3f49;
    --text: #f3f4f6; --muted: #a1a7b3; --faint: #6b7280;
    --accent: #4f8cff; --accent-weak: #1b2a47; --accent-text: #8fb4ff;
    --ok: #34c467; --ok-weak: #15291d; --warn: #f0a432; --warn-weak: #2e2414; --bad: #f2645f; --bad-weak: #301819;
    --ai: #a78bfa; --ai-weak: #251d3a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 40px rgba(0,0,0,.45);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.5 var(--font); color: var(--text); background: var(--page); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Page chrome */
.topbar { display: flex; align-items: center; gap: 12px; padding: 14px 24px; max-width: 1120px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #2563eb, #7c3aed); display: grid; place-items: center; color: #fff; font-size: 15px; }
.demo-badge { font-size: 12px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.spacer { flex: 1; }
.lang { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px; background: var(--window); }
.lang button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--text); color: var(--window); }
.lead { max-width: 1120px; margin: 4px auto 18px; padding: 0 24px; color: var(--muted); }

/* App window */
.window { max-width: 1072px; margin: 0 auto 40px; background: var(--window); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.titlebar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.dots { display: flex; gap: 8px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.dots i:nth-child(1) { background: #ff5f57; } .dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
.titlebar .title { flex: 1; text-align: center; font-weight: 600; font-size: 13px; color: var(--muted); margin-right: 52px; }
.tabs { display: flex; justify-content: center; padding: 14px 16px 6px; }
.segmented { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.segmented button { border: 0; background: none; padding: 5px 16px; border-radius: 7px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.segmented button[aria-pressed="true"] { background: var(--window); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }

.btn { border: 1px solid var(--line-strong); background: var(--window); border-radius: 8px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--panel); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); background: var(--accent); }
.btn.large { padding: 9px 18px; font-size: 14px; }
.btn.link { border: 0; background: none; color: var(--accent-text); padding: 0; font-size: 12px; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); padding: 4px 8px; }
.btn.ai { border-color: var(--ai); color: var(--ai); }

select, input[type="text"], input[type="password"], textarea {
  border: 1px solid var(--line-strong); background: var(--window); border-radius: 8px; padding: 6px 10px; font-size: 13px; min-width: 0;
}
select:focus, input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Spec Check header */
.check-header { padding: 10px 20px 12px; display: grid; gap: 6px; }
.check-header .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.check-header label { color: var(--muted); font-size: 13px; }
.check-header select { max-width: 340px; }
.summary { color: var(--muted); font-size: 13px; }
.notes { color: var(--faint); font-size: 12px; }

.content { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 380px; position: relative; }
.content.drag::after { content: ""; position: absolute; inset: 6px; border: 3px solid var(--accent); border-radius: 12px; pointer-events: none; }

.empty { margin: 18px; min-height: 340px; border: 2px dashed var(--line-strong); border-radius: 14px; display: grid; place-items: center; text-align: center; padding: 28px 18px; }
.empty .icon { font-size: 40px; line-height: 1; margin-bottom: 10px; }
.empty h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
.empty p { margin: 0 auto 16px; color: var(--muted); max-width: 440px; }
.empty .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.empty .fine { margin-top: 14px; font-size: 12px; color: var(--faint); max-width: 440px; }

.list { list-style: none; margin: 0; padding: 4px 0; }
.item { padding: 12px 20px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item-head { display: flex; align-items: center; gap: 12px; }
.status { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; flex: none; }
.status.pass { background: var(--ok); } .status.warning { background: var(--warn); } .status.fail { background: var(--bad); }
.status.small { width: 16px; height: 16px; font-size: 10px; }
.status.checking { background: none; border: 2px solid var(--line-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.item-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-sub { font-size: 12px; color: var(--muted); }
.item-main { flex: 1; min-width: 0; }
.findings { display: grid; grid-template-columns: 16px minmax(110px, auto) minmax(0, 1fr) minmax(0, 1fr); gap: 4px 14px; margin: 10px 0 0 34px; font-size: 12.5px; align-items: center; }
.findings .rule { font-weight: 600; }
.findings .exp { color: var(--muted); }
.findings .act.fail { color: var(--bad); font-weight: 600; } .findings .act.warning { color: var(--warn); font-weight: 600; }
.more { margin: 6px 0 0 34px; }
.plan { margin: 10px 0 0 34px; font-size: 12.5px; color: var(--muted); }
.plan b { color: var(--text); font-weight: 600; }
.plan ul { margin: 2px 0 0; padding-left: 18px; }
.reason { margin: 10px 0 0 34px; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; }
.fixed-box { margin: 10px 0 0 34px; background: var(--ok-weak); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fixed-box.still { background: var(--bad-weak); }
.progress { width: 110px; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .15s linear; }

.footer { display: flex; align-items: center; gap: 10px; padding: 12px 20px; flex-wrap: wrap; font-size: 13px; }
.count { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.count.pass { color: var(--ok); } .count.warning { color: var(--warn); } .count.fail { color: var(--bad); } .count.zero { color: var(--muted); font-weight: 500; }
.menu { position: relative; }
.menu-pop { position: absolute; bottom: calc(100% + 6px); left: 0; background: var(--window); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; min-width: 220px; z-index: 5; }
.menu-pop button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; font-size: 13px; }
.menu-pop button:hover { background: var(--accent-weak); }

/* Presets & settings tabs */
.pane { padding: 18px 20px 24px; min-height: 460px; }
.pane h3 { margin: 0 0 4px; font-size: 15px; }
.pane .muted { color: var(--muted); margin: 0 0 14px; font-size: 13px; }
.preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.preset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel); }
.preset b { display: block; font-size: 13px; }
.preset span { font-size: 12px; color: var(--muted); }
.form { display: grid; gap: 12px; max-width: 620px; }
.form-group { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--panel); display: grid; gap: 10px; }
.form-group h4 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.field { display: grid; grid-template-columns: 170px minmax(0, 1fr); align-items: center; gap: 10px; font-size: 13px; }
.field .hint { grid-column: 2; font-size: 12px; color: var(--faint); margin-top: -6px; }
.ok-text { color: var(--ok); } .mono { font-family: var(--mono); font-size: 12px; }

/* Modal */
.scrim { position: fixed; inset: 0; background: rgba(15,23,42,.42); display: grid; place-items: center; padding: 16px; z-index: 20; }
.sheet { background: var(--window); border-radius: 16px; box-shadow: var(--shadow); width: min(920px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); }
.sheet.narrow { width: min(600px, 100%); }
.sheet-body { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 0; flex: 1; overflow: hidden; }
.spec-list { border-right: 1px solid var(--line); overflow: auto; padding: 8px; background: var(--panel); }
.spec-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; }
.spec-list button[aria-current="true"] { background: var(--accent); color: #fff; }
.spec-list button[aria-current="true"] small { color: rgba(255,255,255,.8); }
.spec-list small { display: block; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spec-editor { overflow: auto; padding: 16px 18px; display: grid; gap: 12px; align-content: start; }
.sheet-foot { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.sheet-pad { padding: 20px; display: grid; gap: 12px; overflow: auto; }
.sheet-pad h3 { margin: 0; font-size: 17px; }
.ai-banner { display: flex; gap: 10px; align-items: flex-start; background: var(--ai-weak); border-radius: 12px; padding: 12px; }
.ai-banner b { display: block; }
.ai-banner .grow { flex: 1; font-size: 13px; color: var(--muted); }
textarea { width: 100%; min-height: 190px; resize: vertical; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; }
.kinds { display: flex; gap: 12px; flex-wrap: wrap; }
.kinds label { display: inline-flex; gap: 5px; align-items: center; }
.err { color: var(--bad); font-size: 13px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--window); padding: 9px 16px; border-radius: 10px; font-size: 13px; z-index: 40; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }

@media (max-width: 720px) {
  .topbar { padding: 12px 16px; flex-wrap: wrap; }
  .lead { padding: 0 16px; }
  .window { margin: 0 8px 24px; border-radius: 12px; }
  .titlebar .title { margin-right: 0; }
  .check-header, .item, .footer, .pane { padding-left: 14px; padding-right: 14px; }
  .check-header select { max-width: 100%; flex: 1 1 200px; }
  .findings { grid-template-columns: 16px minmax(0, 1fr); margin-left: 0; }
  .findings .exp, .findings .act { grid-column: 2; }
  .plan, .reason, .fixed-box, .more { margin-left: 0; }
  .sheet-body { grid-template-columns: 1fr; overflow: auto; }
  .spec-list { border-right: 0; border-bottom: 1px solid var(--line); max-height: 180px; }
  .field { grid-template-columns: 1fr; gap: 4px; }
  .field .hint { grid-column: 1; margin-top: 0; }
  .segmented button { padding: 5px 10px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span><span>File Converter · Spec Check</span></div>
  <span class="demo-badge" data-i18n="demoBadge"></span>
  <span class="spacer"></span>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="vi">Tiếng Việt</button>
    <button type="button" data-lang="ko">한국어</button>
    <button type="button" data-lang="en">English</button>
  </div>
</header>
<p class="lead" data-i18n="lead"></p>

<main class="window" aria-label="File Converter">
  <div class="titlebar"><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="title">File Converter</div></div>
  <nav class="tabs"><div class="segmented" id="tabs" role="tablist"></div></nav>
  <section id="view"></section>
</main>

<input type="file" id="file-input" class="sr-only" multiple accept="video/*,image/*,audio/*,.pdf,.mov,.mkv">
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>

let lang = (() => {
  try { const saved = localStorage.getItem("speccheck-lang"); if (saved && STR[saved]) return saved; } catch (e) {}
  const nav = (navigator.language || "vi").slice(0, 2);
  return STR[nav] ? nav : "vi";
})();

function t(key, params) {
  let s = (STR[lang] && STR[lang][key]) ?? STR.en[key] ?? key;
  if (params) for (const k in params) s = s.split("{" + k + "}").join(params[k]);
  return s;
}
const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ------------------------------------------------------------------ formatting (mirrors SpecFormat) */
function num(v, d = 2) { const f = Math.pow(10, d); const r = Math.round(v * f) / f; return Number.isInteger(r) ? String(r) : String(r); }
const fmtS = (v) => num(v, 1) + " s";
const fmtMB = (v) => num(v, 2) + " MB";
const fmtFps = (v) => num(v, 2) + " fps";
function ratioText(w, h) {
  const g = (a, b) => (b ? g(b, a % b) : a); const d = Math.max(1, g(w, h)); const rw = w / d, rh = h / d;
  return rw <= 32 && rh <= 32 ? rw + ":" + rh : num(w / h) + ":1";
}

/* ------------------------------------------------------------------ checker (port of SpecChecker.swift) */
function ratioValue(r) { const [a, b] = r.split(":").map(Number); return a / b; }
function check(info, spec) {
  const F = [];
  const push = (rule, status, expected, actual) => F.push({ rule, status, expected, actual });
  if (spec.kinds && spec.kinds.length) {
    const ok = spec.kinds.includes(info.kind);
    push("mediaKind", ok ? "pass" : "fail", spec.kinds.map((k) => t("kind_" + k)).join(" " + t("or") + " "), t("kind_" + info.kind));
    if (!ok) return F;
  }
  if (spec.exts && spec.exts.length) {
    const ext = normExt(info.name.split(".").pop());
    push("fileFormat", spec.exts.includes(ext) ? "pass" : "fail", spec.exts.map((e) => "." + e).join(", "), "." + ext);
  }
  if (spec.maxMB != null) push("fileSize", info.sizeMB <= spec.maxMB ? "pass" : "fail", "≤ " + fmtMB(spec.maxMB), fmtMB(info.sizeMB));
  const visual = info.kind === "video" || info.kind === "image";
  if (visual && (spec.width || spec.height)) {
    const exp = (spec.width || t("any")) + " × " + (spec.height || t("any"));
    if (info.w == null) push("dimensions", "warning", exp, t("unknown"));
    else push("dimensions", (!spec.width || spec.width === info.w) && (!spec.height || spec.height === info.h) ? "pass" : "fail", exp, info.w + " × " + info.h);
  }
  if (visual && spec.ratios && spec.ratios.length) {
    const exp = spec.ratios.join(" " + t("or") + " ");
    if (info.w == null) push("aspectRatio", "warning", exp, t("unknown"));
    else { const v = info.w / info.h; push("aspectRatio", spec.ratios.some((r) => Math.abs(v - ratioValue(r)) <= ratioValue(r) * 0.01) ? "pass" : "fail", exp, ratioText(info.w, info.h)); }
  }
  const timed = info.kind === "video" || info.kind === "audio";
  if (timed && (spec.minDur != null || spec.maxDur != null)) {
    const exp = spec.minDur != null && spec.maxDur != null ? fmtS(spec.minDur) + " – " + fmtS(spec.maxDur) : spec.minDur != null ? "≥ " + fmtS(spec.minDur) : "≤ " + fmtS(spec.maxDur);
    if (info.dur == null) push("duration", "warning", exp, t("unknown"));
    else push("duration", (spec.minDur == null || info.dur >= spec.minDur) && (spec.maxDur == null || info.dur <= spec.maxDur) ? "pass" : "fail", exp, fmtS(info.dur));
  }
  if (info.kind === "video" && spec.maxFps != null) {
    if (info.fps == null) push("frameRate", "warning", "≤ " + fmtFps(spec.maxFps), t("unknown"));
    else push("frameRate", info.fps <= spec.maxFps + 0.05 ? "pass" : "fail", "≤ " + fmtFps(spec.maxFps), fmtFps(info.fps));
  }
  if (info.kind === "video" && spec.vcodecs && spec.vcodecs.length) {
    if (!info.vcodec) push("videoCodec", "warning", spec.vcodecs.join(", "), t("unknown"));
    else push("videoCodec", spec.vcodecs.includes(info.vcodec) ? "pass" : "fail", spec.vcodecs.join(", "), info.vcodec);
  }
  if (timed) {
    if (spec.audio !== "optional") {
      if (info.audio == null) push("audioTrack", "warning", spec.audio === "required" ? t("hasAudio") : t("noAudio"), t("unknown"));
      else if (spec.audio === "required") push("audioTrack", info.audio ? "pass" : "fail", t("hasAudio"), info.audio ? t("hasAudio") : t("noAudio"));
      else push("audioTrack", info.audio ? "fail" : "pass", t("noAudio"), info.audio ? t("hasAudio") : t("noAudio"));
    }
    if (info.audio && spec.acodecs && spec.acodecs.length) {
      if (!info.acodec) push("audioCodec", "warning", spec.acodecs.join(", "), t("unknown"));
      else push("audioCodec", spec.acodecs.includes(info.acodec) ? "pass" : "fail", spec.acodecs.join(", "), info.acodec);

}
const worst = (F) => (F.some((f) => f.status === "fail") ? "fail" : F.some((f) => f.status === "warning") ? "warning" : "pass");
function normExt(e) { e = String(e || "").trim().toLowerCase().replace(/^\./, ""); return e === "jpeg" ? "jpg" : e; }

/* ------------------------------------------------------------------ fix planner (port of SpecFixPlanner.swift) */
function plan(info, spec, findings) {
  const failed = new Set(findings.filter((f) => f.status === "fail").map((f) => f.rule));
  if (!failed.size) return null;
  if (failed.has("mediaKind")) return { error: t("r_wrongKind", { e: spec.kinds.map((k) => t("kind_" + k)).join("/"), a: t("kind_" + info.kind) }) };
  if (info.kind === "video") return planVideo(info, spec, failed);
  if (info.kind === "image") return planImage(info, spec, failed);
  return { error: t("r_unsupported", { k: t("kind_" + info.kind) }) };
}
function targetSize(info, spec, even) {
  const fin = (w, h) => { w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h)); if (even) { w -= w % 2; h -= h % 2; } return { w, h }; };
  if (spec.width && spec.height) return fin(spec.width, spec.height);
  const src = info.w / info.h, rs = spec.ratios || [];
  const allowed = !rs.length || rs.some((r) => Math.abs(src - ratioValue(r)) <= ratioValue(r) * 0.01);
  const r = allowed ? src : ratioValue(rs[0]);
  let w = info.w, h = info.h;
  if (!allowed) { if ((src > r) === (state.fit === "pad")) h = w / r; else w = h * r; }
  return fin(w, h);
}
function planVideo(info, spec, failed) {
  if (failed.has("duration") && spec.minDur != null && info.dur < spec.minDur) return { error: t("r_tooShort", { a: fmtS(info.dur), m: fmtS(spec.minDur) }) };
  const exts = spec.exts || [];
  if (exts.length && !exts.includes("mp4")) return { error: t("r_noFormat", { f: exts.join(", ") }) };
  const actions = [], out = { ext: "mp4", vcodec: "h264", acodec: "aac" };
  const srcExt = normExt(info.name.split(".").pop());
  actions.push(srcExt !== "mp4" || info.vcodec !== "h264" ? t("a_reencode", { ext: "mp4", codec: "H264" }) : t("a_reencodeSame", { codec: "H264" }));
  let size = { w: info.w, h: info.h };
  if (failed.has("dimensions") || failed.has("aspectRatio")) {
    size = targetSize(info, spec, true);
    const ratioChanges = Math.abs(info.w / info.h - size.w / size.h) > (size.w / size.h) * 0.01;
    actions.push(ratioChanges ? t(state.fit === "pad" ? "a_pad" : "a_crop", size) : t("a_resize", size));
  }
  let dur = info.dur;
  if (failed.has("duration") && spec.maxDur != null) { dur = Math.min(dur, spec.maxDur); actions.push(t("a_trim", { s: fmtS(spec.maxDur) })); }
  let fps = info.fps;
  if (failed.has("frameRate") && spec.maxFps != null) { fps = spec.maxFps; actions.push(t("a_fps", { fps: fmtFps(spec.maxFps) })); }
  let audio = info.audio;
  if (spec.audio === "required" && !info.audio) { audio = true; actions.push(t("a_silent")); }
  if (spec.audio === "forbidden" && info.audio) { audio = false; actions.push(t("a_mute")); }
  let sizeMB = Math.min(info.sizeMB, info.sizeMB * (dur / info.dur) * 0.8);
  if (spec.maxMB != null && dur) {
    const total = spec.maxMB * 8000 * 0.9 / dur;
    let a = audio ? 128 : 0;
    if (audio && total - a < 300) a = 64;
    const v = Math.floor(total) - a;
    if (v < 150) return { error: t("r_sizeSmall", { mb: fmtMB(spec.maxMB), s: fmtS(dur) }) };
    if (failed.has("fileSize")) actions.push(t("a_bitrate", { k: v, mb: fmtMB(spec.maxMB) }));
    sizeMB = Math.min(sizeMB, spec.maxMB * 0.86);
  }
  const fixed = { ...info, name: info.name.replace(/\.[^.]+$/, "") + "_fixed.mp4", w: size.w, h: size.h, dur, fps, audio, vcodec: "h264", acodec: audio ? "aac" : null, sizeMB: Math.round(sizeMB * 10) / 10, real: false };
  return { actions, fixed };
}
function planImage(info, spec, failed) {
  const exts = spec.exts || [];
  const ok = (e) => !exts.length || exts.includes(e);
  const src = normExt(info.name.split(".").pop());
  let ext = ["png", "jpg", "webp", "avif"].includes(src) && ok(src) ? src : ["png", "jpg", "webp", "avif"].find(ok);
  if (!ext) return { error: t("r_noFormat", { f: exts.join(", ") }) };
  if (failed.has("fileSize") && ext === "png" && ok("jpg")) ext = "jpg";
  const actions = []; let size = { w: info.w, h: info.h };
  if (ext !== src) actions.push(t("a_convert", { ext }));
  if (failed.has("dimensions") || failed.has("aspectRatio")) { size = targetSize(info, spec, false); actions.push(t(state.fit === "pad" ? "a_pad" : "a_crop", size)); }
  let sizeMB = info.sizeMB;
  if (failed.has("fileSize")) { actions.push(t("a_quality", { q: 80 })); sizeMB = Math.min(sizeMB * 0.35, (spec.maxMB || sizeMB) * 0.7); }

}

/* ------------------------------------------------------------------ items */
function addInfos(infos) {
  let dup = false;
  for (const info of infos) {
    if (state.items.some((i) => i.info.name === info.name && i.info.sizeMB === info.sizeMB)) { dup = true; continue; }
    const item = { id: ++uid, info, checking: true, fix: { state: "idle" } };
    state.items.push(item);

  }
  if (dup) toast(t("toastDup"));
  render();
}
function addSamples() { addInfos(SAMPLE_FILES.map((f) => ({ ...f }))); }

function readRealFile(file) {
  return new Promise((resolve) => {
    const ext = normExt(file.name.split(".").pop());
    const type = file.type || "";
    const kind = type.startsWith("video/") || ["mp4", "mov", "mkv", "webm", "avi", "m4v"].includes(ext) ? "video"
      : type.startsWith("image/") || ["png", "jpg", "webp", "heic", "gif", "avif", "tif", "tiff", "bmp"].includes(ext) ? "image"
      : type.startsWith("audio/") ? "audio" : ext === "pdf" ? "document" : "other";
    const base = { name: file.name, kind, sizeMB: Math.round(file.size / 10000) / 100, w: null, h: null, dur: null, fps: null, vcodec: null, acodec: null, audio: null, real: true };
    const url = URL.createObjectURL(file);
    const done = (extra) => { URL.revokeObjectURL(url); resolve({ ...base, ...extra }); };
    if (kind === "image") { const img = new Image(); img.onload = () => done({ w: img.naturalWidth, h: img.naturalHeight }); img.onerror = () => done({}); img.src = url; }
    else if (kind === "video" || kind === "audio") {
      const el = document.createElement(kind === "video" ? "video" : "audio"); el.preload = "metadata"; el.muted = true;
      el.onloadedmetadata = () => done(kind === "video" ? { w: el.videoWidth || null, h: el.videoHeight || null, dur: isFinite(el.duration) ? Math.round(el.duration * 10) / 10 : null } : { dur: isFinite(el.duration) ? Math.round(el.duration * 10) / 10 : null });
      el.onerror = () => done({}); el.src = url;
      setTimeout(() => done({}), 4000);
    } else done({});
  });
}
async function addRealFiles(files) {
  if (!files || !files.length) return;
  const infos = await Promise.all([...files].map(readRealFile));
  addInfos(infos);
}

function runFix(item) {
  const spec = currentSpec();
  const F = check(item.info, spec);
  const p = plan(item.info, spec, F);
  if (!p || p.error) return;
  item.fix = { state: "fixing", progress: 0 };
  render();
  const started = performance.now(), total = 1400 + Math.random() * 1200;
  const tick = () => {
    const pr = Math.min(1, (performance.now() - started) / total);
    item.fix.progress = pr;
    const bar = document.querySelector('[data-progress="' + item.id + '"]');
    if (bar) bar.style.width = Math.round(pr * 100) + "%";
    if (pr < 1) requestAnimationFrame(tick);
    else { item.fix = { state: "fixed", info: p.fixed }; render(); toast(t("toastFixed", { name: p.fixed.name })); }
  };
  requestAnimationFrame(tick);
}

/** Switching spec invalidates fixes planned for the old one (same as recheckAll in the app). */
function selectSpec(id) {
  if (state.specId === id) return;
  state.specId = id;
  state.items.forEach((i) => { if (i.fix.state !== "fixing") i.fix = { state: "idle" }; });
}

function itemFindings(item) { return check(item.info, currentSpec()); }
function effectiveStatus(item) {
  if (item.checking) return null;
  if (item.fix.state === "fixed") return worst(check(item.fix.info, currentSpec()));
  return worst(itemFindings(item));
}
function fixable(item) {
  if (item.checking || item.fix.state !== "idle") return false;
  const F = itemFindings(item); if (worst(F) !== "fail") return false;
  const p = plan(item.info, currentSpec(), F); return !!(p && !p.error);
}

/* ------------------------------------------------------------------ rendering */
const view = document.getElementById("view");
const statusDot = (s, small) => s ? '<span class="status ' + s + (small ? " small" : "") + '" aria-label="' + s + '">' + (s === "pass" ? "✓" : s === "warning" ? "!" : "✕") + "</span>" : '<span class="status checking' + (small ? " small" : "") + '"></span>';

function findingsGrid(F) {

function renderItem(item) {

    else if (item.fix.state === "fixing") h += '<div class="progress" aria-label="' + esc(t("converting")) + '"><i data-progress="' + item.id + '" style="width:' + Math.round(item.fix.progress * 100) + '%"></i></div>';
    else h += '<button type="button" class="btn" data-reveal="' + item.id + '">' + esc(t("showFixed")) + "</button>";
  }
  if (item.fix.state !== "fixing") h += '<button type="button" class="btn ghost" data-remove="' + item.id + '" aria-label="' + esc(t("remove")) + '" title="' + esc(t("remove")) + '">✕</button>';
  h += "</div>";

  const shown = state.showAll[item.id] ? F : F.filter((f) => f.status !== "pass");
  if (shown.length) h += findingsGrid(shown);
  if (F.some((f) => f.status === "pass") && F.length) h += '<div class="more"><button type="button" class="btn link" data-toggle="' + item.id + '">' + esc(state.showAll[item.id] ? t("hidePass") : t("showAll", { n: F.length })) + "</button></div>";

  if (st === "fail") {
    if (item.fix.state === "idle" && p) {
      if (p.error) h += '<div class="reason">✋ <span>' + esc(p.error) + "</span></div>";
      else h += '<div class="plan"><b>' + esc(t("fixWill")) + "</b><ul>" + p.actions.map((a) => "<li>" + esc(a) + "</li>").join("") + "</ul>" + esc(t("origSafe")) + "</div>";
    } else if (item.fix.state === "fixing") {
      h += '<div class="plan">' + esc(t("converting")) + "</div>";
    } else if (item.fix.state === "fixed") {
      const FF = check(item.fix.info, spec), fs = worst(FF);
      h += '<div class="fixed-box' + (fs === "fail" ? " still" : "") + '">' + statusDot(fs, true) + "<b>" + esc(item.fix.info.name) + "</b> — " + esc(fs === "fail" ? t("fixedStill", { n: FF.filter((f) => f.status === "fail").length }) : t("fixedPass")) + '<span class="item-sub">' + esc([item.fix.info.w + "×" + item.fix.info.h, item.fix.info.dur != null ? fmtS(item.fix.info.dur) : null, fmtMB(item.fix.info.sizeMB)].filter(Boolean).join(" · ")) + "</span></div>";
      if (fs !== "pass") h += findingsGrid(FF.filter((f) => f.status !== "pass"));
    }
  }
  return h + "</li>";
}

function renderPresets() {
  const presets = [["To MP4", "H.264 · CRF 23"], ["To MKV", "H.264 · CRF 23"], ["To WEBM", "VP9"], ["To GIF", "15 fps"], ["To MP3", "VBR 190 kbps"], ["To AAC", "128 kbps"], ["To WAV", "16-bit"], ["To JPG", "quality 90"], ["To PNG", "lossless"], ["To WEBP", "quality 40"], ["To PDF", "200 dpi"], ["To ICO", "≤ 256 px"]];
  return '<div class="pane"><h3>' + esc(t("presetsTitle")) + '</h3><p class="muted">' + esc(t("presetsBody")) + '</p><div class="preset-grid">' + presets.map(([n, d]) => '<div class="preset"><b>' + n + "</b><span>" + d + "</span></div>").join("") + "</div></div>";
}

function renderSettings() {
  const s = state.settings;
  return '<div class="pane"><div class="form">' +
    '<div class="form-group"><h4>' + esc(t("sGeneral")) + '</h4><div class="field"><label for="st-c">' + esc(t("sConcurrent")) + '</label><input id="st-c" type="text" inputmode="numeric" value="' + s.concurrent + '" data-setting="concurrent" style="max-width:80px"></div>' +
    '<div class="field"><span>' + esc(t("sQuit")) + '</span><label><input type="checkbox" data-setting="quit"' + (s.quit ? " checked" : "") + "></label></div></div>" +
    '<div class="form-group"><h4>' + esc(t("sAI")) + '</h4><div class="field"><label for="st-k">' + esc(t("sKey")) + '</label><input id="st-k" type="password" placeholder="sk-ant-…" value="' + esc(s.key) + '" data-setting="key"></div><div class="field"><span></span><span><button type="button" class="btn" data-act="savekey">' + esc(t("sSave")) + "</button> " + (s.saved ? '<span class="ok-text">✓ ' + esc(t("sSaved")) + "</span>" : "") + '</span><span class="hint">' + esc(t("sKeyHint")) + "</span></div></div>" +
    '<div class="form-group"><h4>' + esc(t("sBackends")) + "</h4>" +
    [["ffmpeg", "/opt/homebrew/bin/ffmpeg"], ["ffprobe", "/opt/homebrew/bin/ffprobe"], ["ImageMagick", "/opt/homebrew/bin/magick"], ["LibreOffice", "/Applications/LibreOffice.app"]].map(([n, p]) => '<div class="field"><span>' + n + '</span><span class="mono"><span class="ok-text">✓</span> ' + p + "</span></div>").join("") +
    "</div></div></div>";
}

/* ------------------------------------------------------------------ modals */
const modalRoot = document.getElementById("modal-root");
function renderModal() {
  if (!state.modal) { modalRoot.innerHTML = ""; return; }
  if (state.modal === "library") modalRoot.innerHTML = '<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(t("libTitle")) + '">' + renderLibrary() + "</div></div>";
  if (state.modal === "ai") modalRoot.innerHTML = '<div class="scrim" data-scrim><div class="sheet narrow" role="dialog" aria-modal="true" aria-label="' + esc(t("aiTitle")) + '">' + renderAI() + "</div></div>";
}

function renderLibrary() {
  const sel = state.specs.find((s) => s.id === state.libSel) || state.specs[0];
  state.libSel = sel.id;
  let h = '<div class="sheet-body"><div class="spec-list">' + state.specs.map((s) => '<button type="button" data-libsel="' + s.id + '" aria-current="' + (s.id === sel.id) + '">' + (s.ai ? "✨ " : "") + esc(specName(s)) + "<small>" + esc(specSummary(s)) + "</small></button>").join("") + "</div>";
  h += '<div class="spec-editor">';
  if (sel.ai) h += '<div class="ai-banner"><span aria-hidden="true">✨</span><div class="grow"><b>' + esc(t("aiBannerTitle")) + "</b>" + esc(t("aiBannerBody")) + '</div><button type="button" class="btn" data-act="reviewed">' + esc(t("looksRight")) + "</button></div>";
  const v = (x) => (x == null ? "" : esc(Array.isArray(x) ? x.join(", ") : x));
  const field = (key, label, val, ph) => '<div class="field"><label for="f-' + key + '">' + esc(t(label)) + '</label><input id="f-' + key + '" type="text" data-field="' + key + '" value="' + v(val) + '" placeholder="' + esc(t(ph || "phAny")) + '"></div>';
  h += '<div class="form-group"><h4>' + esc(t("f_general")) + "</h4>" + '<div class="field"><label for="f-name">' + esc(t("f_name")) + '</label><input id="f-name" type="text" data-field="name" value="' + esc(specName(sel)) + '"></div>' +
    '<div class="field"><label for="f-notes">' + esc(t("f_notes")) + '</label><input id="f-notes" type="text" data-field="notes" value="' + esc(specNotes(sel)) + '"></div>' +
    '<div class="field"><span>' + esc(t("f_for")) + '</span><span class="kinds">' + ["video", "image", "audio", "document"].map((k) => '<label><input type="checkbox" data-kind="' + k + '"' + (sel.kinds.includes(k) ? " checked" : "") + "> " + esc(t("kind_" + k)) + "</label>").join("") + "</span></div></div>";
  h += '<div class="form-group"><h4>' + esc(t("f_file")) + "</h4>" + field("exts", "f_formats", sel.exts, "phFormats") + field("maxMB", "f_maxSize", sel.maxMB) + "</div>";
  h += '<div class="form-group"><h4>' + esc(t("f_frame")) + "</h4>" + field("width", "f_width", sel.width) + field("height", "f_height", sel.height) + field("ratios", "f_ratios", sel.ratios, "phRatios") + "</div>";
  h += '<div class="form-group"><h4>' + esc(t("f_timing")) + "</h4>" + field("minDur", "f_minDur", sel.minDur) + field("maxDur", "f_maxDur", sel.maxDur) + field("maxFps", "f_maxFps", sel.maxFps) + "</div>";
  h += '<div class="form-group"><h4>' + esc(t("f_codecs")) + "</h4>" + field("vcodecs", "f_vcodec", sel.vcodecs) + field("acodecs", "f_acodec", sel.acodecs) +
    '<div class="field"><label for="f-audio">' + esc(t("f_audio")) + '</label><select id="f-audio" data-field="audio">' + ["optional", "required", "forbidden"].map((a) => '<option value="' + a + '"' + (sel.audio === a ? " selected" : "") + ">" + esc(t("aud_" + a)) + "</option>").join("") + '</select></div><div class="field"><span></span><span class="hint">' + esc(t("emptyHint")) + "</span></div></div>";
  h += "</div></div>";
  h += '<div class="sheet-foot"><button type="button" class="btn" data-act="newspec">+ ' + esc(t("newSpec")) + '</button><button type="button" class="btn" data-act="dupspec">' + esc(t("duplicate")) + '</button><button type="button" class="btn ai" data-act="openai">✨ ' + esc(t("aiDraft")) + '</button><button type="button" class="btn" data-act="delspec"' + (state.specs.length > 1 ? "" : " disabled") + ">" + esc(t("del")) + '</button><span class="spacer"></span><button type="button" class="btn ghost" data-act="restore">' + esc(t("restore")) + '</button><button type="button" class="btn primary" data-act="closelib">' + esc(t("done")) + "</button></div>";
  return h;
}

function renderAI() {
  return '<div class="sheet-pad"><h3>✨ ' + esc(t("aiTitle")) + '</h3><p class="summary" style="margin:0">' + esc(t("aiBody")) + '</p><textarea id="ai-text" data-ai-text placeholder="Video: MP4, H.264, 9:16, 1080×1920, 5–60 s, ≤ 30 MB…">' + esc(state.aiText) + "</textarea>" +
    (state.aiError ? '<div class="err">' + esc(state.aiError) + "</div>" : "") +
    '<div class="notes">' + esc(t("aiDemoNote")) + "</div></div>" +
    '<div class="sheet-foot"><button type="button" class="btn" data-act="aiexample">' + esc(t("aiPasteExample")) + '</button><span class="spacer"></span>' +
    (state.aiWorking ? '<span class="summary">' + statusDot(null, true) + " " + esc(t("aiWorking")) + "</span>" : "") +
    '<button type="button" class="btn" data-act="aicancel"' + (state.aiWorking ? " disabled" : "") + ">" + esc(t("aiCancel")) + '</button><button type="button" class="btn primary" data-act="aidraft"' + (state.aiWorking ? " disabled" : "") + ">" + esc(t("aiDraftBtn")) + "</button></div>";
}

/* ------------------------------------------------------------------ reports */
function reportRows() {
  const spec = currentSpec();
  return state.items.filter((i) => !i.checking).map((i) => {
    const info = i.fix.state === "fixed" ? i.fix.info : i.info;
    const F = check(info, spec);
    return { name: info.name, spec: specName(spec), status: worst(F), F };
  });
}
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast(t("toastExport", { name }));
}
const label = (s) => (s === "pass" ? "Pass" : s === "warning" ? "Review" : "Fail");
function exportCSV() {
  const q = (v) => (/[",\n]/.test(v) ? '"' + String(v).replace(/"/g, '""') + '"' : v);
  const rows = [["File", "Spec", "Overall", "Rule", "Status", "Expected", "Actual"]];
  reportRows().forEach((r) => r.F.forEach((f) => rows.push([r.name, r.spec, label(r.status), t("rule_" + f.rule), label(f.status), f.expected, f.actual])));
  download("spec-check-report.csv", "﻿" + rows.map((r) => r.map(q).join(",")).join("\r\n") + "\r\n", "text/csv;charset=utf-8");
}
function exportHTML() {
  const rows = reportRows();
  const n = (s) => rows.filter((r) => r.status === s).length;
  const icon = (s) => (s === "pass" ? '<b style="color:#16a34a">✓</b>' : s === "warning" ? '<b style="color:#d97706">!</b>' : '<b style="color:#dc2626">✕</b>');
  const body = rows.map((r) => '<section style="border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:14px 0"><h2 style="font-size:16px;margin:0">' + icon(r.status) + " " + esc(r.name) + '</h2><p style="color:#6b7280;margin:2px 0 10px">' + esc(r.spec) + '</p><table style="border-collapse:collapse;width:100%;font-size:14px">' + r.F.map((f) => '<tr style="border-top:1px solid #e5e7eb' + (f.status === "fail" ? ";color:#dc2626" : "") + '"><td style="padding:5px 6px">' + esc(t("rule_" + f.rule)) + '</td><td style="padding:5px 6px;color:#6b7280">' + esc(f.expected) + '</td><td style="padding:5px 6px">' + esc(f.actual) + '</td><td>' + icon(f.status) + "</td></tr>").join("") + "</table></section>").join("");
  download("spec-check-report.html", '<!doctype html><html lang="' + lang + '"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(t("reportTitle")) + '</title></head><body style="font:15px/1.5 -apple-system,system-ui,sans-serif;max-width:860px;margin:32px auto;padding:0 16px;color:#111827"><h1 style="margin:0">' + esc(t("reportTitle")) + '</h1><p style="color:#6b7280">' + esc(new Date().toLocaleString(lang)) + " · " + esc(t("reportFiles", { n: rows.length })) + '</p><p><b style="color:#16a34a">✓ ' + esc(t("countPass", { n: n("pass") })) + '</b> &nbsp; <b style="color:#d97706">! ' + esc(t("countReview", { n: n("warning") })) + '</b> &nbsp; <b style="color:#dc2626">✕ ' + esc(t("countFail", { n: n("fail") })) + "</b></p>" + body + "</body></html>", "text/html;charset=utf-8");
}

/* ------------------------------------------------------------------ toast */
let toastTimer;
function toast(msg) {
  const root = document.getElementById("toast-root");
  root.innerHTML = '<div class="toast">' + esc(msg) + "</div>";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { root.innerHTML = ""; }, 2600);
}

/* ------------------------------------------------------------------ events */
const fileInput = document.getElementById("file-input");
fileInput.addEventListener("change", () => { addRealFiles(fileInput.files); fileInput.value = ""; });

document.addEventListener("click", (e) => {
  const el = e.target.closest("button, [data-scrim]");
  if (!el) { if (state.menuOpen) { state.menuOpen = false; render(); } return; }
  if (el.hasAttribute("data-scrim") && e.target === el && !state.aiWorking) { state.modal = state.modal === "ai" ? "library" : null; render(); return; }
  if (el.tagName !== "BUTTON") return;
  const d = el.dataset;
  if (d.lang) { lang = d.lang; try { localStorage.setItem("speccheck-lang", lang); } catch (err) {} render(); return; }
  if (d.tab) { state.tab = d.tab; state.menuOpen = false; render(); return; }
  if (d.fit) { state.fit = d.fit; render(); return; }
  if (d.fix) { const it = state.items.find((i) => i.id === +d.fix); if (it) runFix(it); return; }
  if (d.reveal) { const it = state.items.find((i) => i.id === +d.reveal); if (it) toast(t("toastFinder", { name: it.fix.info.name })); return; }
  if (d.remove) { state.items = state.items.filter((i) => i.id !== +d.remove); render(); return; }
  if (d.toggle) { state.showAll[d.toggle] = !state.showAll[d.toggle]; render(); return; }
  if (d.libsel) { state.libSel = d.libsel; render(); return; }
  const act = d.act;
  if (act !== "menu" && state.menuOpen) state.menuOpen = false;
  switch (act) {
    case "samples": addSamples(); break;
    case "choose": fileInput.click(); break;
    case "fixall": state.items.filter(fixable).forEach(runFix); break;
    case "clear": state.items = state.items.filter((i) => i.fix.state === "fixing"); render(); break;
    case "menu": state.menuOpen = !state.menuOpen; render(); break;
    case "export-html": render(); exportHTML(); break;
    case "export-csv": render(); exportCSV(); break;
    case "library": state.modal = "library"; state.libSel = state.specId; render(); break;
    case "closelib": state.modal = null; render(); break;
    case "newspec": { const s = { id: "u" + Date.now(), name: t("newSpec"), notes: "", kinds: [], exts: null, maxMB: null, width: null, height: null, ratios: null, minDur: null, maxDur: null, maxFps: null, vcodecs: null, acodecs: null, audio: "optional" }; state.specs.push(s); state.libSel = s.id; render(); break; }
    case "dupspec": { const src = state.specs.find((s) => s.id === state.libSel); if (src) { const s = JSON.parse(JSON.stringify(src)); s.id = "u" + Date.now(); s.builtIn = false; s.ai = false; s.name = specName(src) + t("copySuffix"); s.notes = specNotes(src); state.specs.push(s); state.libSel = s.id; render(); } break; }
    case "delspec": if (state.specs.length > 1) { const idx = state.specs.findIndex((s) => s.id === state.libSel); state.specs.splice(idx, 1); if (!state.specs.some((s) => s.id === state.specId)) selectSpec(state.specs[0].id); state.libSel = state.specs[Math.max(0, idx - 1)].id; render(); } break;
    case "restore": DEFAULT_SPECS.forEach((d0) => { const i = state.specs.findIndex((s) => s.id === d0.id); const c = JSON.parse(JSON.stringify(d0)); if (i >= 0) state.specs[i] = c; else state.specs.push(c); }); render(); break;
    case "reviewed": { const s = state.specs.find((x) => x.id === state.libSel); if (s) s.ai = false; render(); break; }
    case "openai": state.modal = "ai"; state.aiError = ""; render(); setTimeout(() => document.getElementById("ai-text")?.focus(), 0); break;
    case "aicancel": state.modal = "library"; render(); break;
    case "aiexample": state.aiText = AI_EXAMPLE; state.aiError = ""; render(); break;
    case "aidraft":
      if (!state.aiText.trim()) { state.aiError = t("aiEmpty"); render(); break; }
      state.aiWorking = true; state.aiError = ""; render();
      setTimeout(() => { const s = AI_DRAFT(); state.specs.push(s); state.libSel = s.id; selectSpec(s.id); state.aiWorking = false; state.aiText = ""; state.modal = "library"; render(); }, 1600);
      break;
    case "savekey": state.settings.saved = !!state.settings.key; render(); break;
  }
});

document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.id === "spec-select") { selectSpec(el.value); render(); return; }
  if (el.dataset.setting === "quit") { state.settings.quit = el.checked; return; }
  if (el.dataset.kind) {
    const s = state.specs.find((x) => x.id === state.libSel); if (!s) return;
    s.kinds = el.checked ? [...new Set([...s.kinds, el.dataset.kind])] : s.kinds.filter((k) => k !== el.dataset.kind);
    render(); return;
  }
  if (el.dataset.field) commitField(el, true);
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.hasAttribute("data-ai-text")) { state.aiText = el.value; return; }
  if (el.dataset.setting === "key") { state.settings.key = el.value; state.settings.saved = false; return; }
  if (el.dataset.setting === "concurrent") { state.settings.concurrent = el.value.replace(/\D/g, "") || ""; return; }
  if (el.dataset.field) commitField(el, false);
});
function commitField(el, rerender) {
  const s = state.specs.find((x) => x.id === state.libSel); if (!s) return;
  const k = el.dataset.field, raw = el.value.trim();
  const list = (x) => { const a = x.split(/[,;\s]+/).map((p) => p.trim().toLowerCase()).filter(Boolean); return a.length ? a : null; };
  if (k === "name") s.name = el.value;
  else if (k === "notes") s.notes = el.value;
  else if (k === "audio") s.audio = el.value;
  else if (k === "exts") { const a = list(raw); s.exts = a ? a.map(normExt) : null; }
  else if (k === "vcodecs" || k === "acodecs") s[k] = list(raw);
  else if (k === "ratios") { const a = (list(raw) || []).filter((r) => /^\d+[:x/]\d+$/.test(r)).map((r) => r.replace(/[x/]/, ":")); s.ratios = a.length ? a : null; }
  else { const n = parseFloat(raw.replace(",", ".")); s[k] = raw === "" || isNaN(n) ? null : n; }
  if (rerender) render();
  else { const btn = document.querySelector('[data-libsel="' + s.id + '"]'); if (btn) btn.innerHTML = (s.ai ? "✨ " : "") + esc(specName(s)) + "<small>" + esc(specSummary(s)) + "</small>"; }
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (state.menuOpen) { state.menuOpen = false; render(); }
    else if (state.modal && !state.aiWorking) { state.modal = state.modal === "ai" ? "library" : null; render(); }
  }
});

// Drag & drop anywhere on the window
const win = document.querySelector(".window");
let dragDepth = 0;
win.addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; state.tab === "check" && document.getElementById("dropzone")?.classList.add("drag"); });
win.addEventListener("dragover", (e) => e.preventDefault());
win.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.getElementById("dropzone")?.classList.remove("drag"); } });
win.addEventListener("drop", (e) => {
  e.preventDefault(); dragDepth = 0; document.getElementById("dropzone")?.classList.remove("drag");
  if (state.tab !== "check") { state.tab = "check"; render(); }
  addRealFiles(e.dataTransfer.files);
});

render();
</script>
</body>
</html>
